name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests — dsh-mcp-guard
        run: node --test packages/dsh-mcp-guard/test/*.test.mjs

      - name: Unit tests — dsh-skill-curator
        run: node --test packages/dsh-skill-curator/test/*.test.mjs

      - name: Unit tests — dsh-visual-studio
        run: node --test packages/dsh-visual-studio/test/*.test.mjs

      - name: Repository validation
        run: node scripts/validate.mjs

      - name: Syntax check dsh-mcp-guard client.js
        run: node --check packages/dsh-mcp-guard/client.js

      - name: Syntax check dsh-mcp-guard index.js
        run: node --check packages/dsh-mcp-guard/index.js

      - name: Syntax check dsh-skill-curator client.js
        run: node --check packages/dsh-skill-curator/client.js

      - name: Syntax check dsh-skill-curator index.js
        run: node --check packages/dsh-skill-curator/index.js

      - name: Syntax check dsh-visual-studio client.js
        run: node --check packages/dsh-visual-studio/client.js

      - name: Syntax check dsh-visual-studio index.js
        run: node --check packages/dsh-visual-studio/index.js
